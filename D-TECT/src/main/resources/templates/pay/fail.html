<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>결제 실패</title>
    <style>
        body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,Arial; margin:0; padding:24px; background:#f7f7f7; color:#111;}
        .card{max-width:720px; margin:0 auto; background:#fff; border:1px solid #eee; border-radius:14px; padding:20px; box-shadow:0 8px 28px rgba(0,0,0,.06);}
        .title{margin:0 0 12px; font-size:1.3rem; font-weight:800; color:#b00020;}
        .row{margin:6px 0;}
        .label{display:inline-block; width:120px; color:#666;}
        .cta{margin-top:16px}
        .btn{display:inline-flex; align-items:center; justify-content:center; padding:10px 14px; border-radius:10px; border:1px solid #ddd; background:#fff; cursor:pointer; text-decoration:none; color:#111;}
    </style>
</head>
<body>
<div class="card">
    <h1 class="title">결제를 완료하지 못했습니다.</h1>

    <div class="row"><span class="label">에러코드</span><span th:text="${code} ?: '—'">—</span></div>
    <div class="row"><span class="label">메시지</span><span th:text="${message} ?: '—'">—</span></div>

    <div class="cta" style="display:flex; gap:8px; margin-top:16px;">
        <a class="btn" href="/mypage/user">마이페이지로</a>
        <a class="btn" href="/">홈으로</a>
    </div>
</div>
</body>
</html>
