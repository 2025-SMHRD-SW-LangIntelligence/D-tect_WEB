<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title></title>
	<!-- 공통 CSS -->
	<link rel="stylesheet" th:href="@{/css/public/common.css}" />
	<!-- 전문가 전용 CSS -->
	<link rel="stylesheet" th:href="@{/css/expert/expert_mypage.css}" />
	<!-- 카카오 우편번호 SDK -->
	<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" defer></script>
</head>

<body th:attr="data-expert-id=${expertId}, data-mem-idx=${memIdx}">
<header class="topbar">
	<div class="left">
		<a class="logo-wrap" aria-label="홈으로">
			<img th:src="@{/images/logo.png}" alt="D-tect" class="logo" />
		</a>
		<h1 class="page-title">마이페이지</h1>
	</div>
	<div class="right">
		<div class="user-chip">
			<img th:src="@{/images/user_icon.png}" alt="" class="avatar" />
			<span class="user-name"
				  th:text="${profile.name} != null ? ${profile.name} + ' 전문가님' : '전문가님'">전문가님</span>
		</div>
		<button type="button" class="text-link" id="logoutBtn">로그아웃</button>
	</div>
</header>

<main class="container">
	<section class="grid">
		<!-- 좌: 개인정보 -->
		<article class="card card--dark">
			<header class="card-head">
				<h2>개인정보</h2>
				<button type="button" class="chip" id="editToggleBtn">수정</button>
			</header>

			<form class="info-form" id="infoForm">
				<label class="field">
					<span class="label">이름</span>
					<input type="text" name="name" th:value="${profile.name}" disabled />
				</label>
				<label class="field">
					<span class="label">이메일</span>
					<input type="email" name="email" th:value="${profile.email}" disabled />
				</label>
				<label class="field">
					<span class="label">사무소명</span>
					<input type="text" name="officeName" th:value="${profile.officeName}" disabled />
				</label>
				<label class="field">
					<span class="label">사무소 주소</span>
					<input type="text" name="officeAddress" th:value="${profile.officeAddress}" disabled />
				</label>

				<!-- 전문분야 칩 -->
				<label class="field">
					<span class="label">전문분야</span>
					<div class="tag-wrap">
              <span class="tag" th:each="opt : ${specialtyOptions}"
					th:if="${profile.specialtyCodes != null and profile.specialtyCodes.contains(opt.code)}"
					th:text="${opt.label}">전문분야</span>
						<span class="tag tag--empty"
							  th:if="${profile.specialtyCodes == null or #lists.isEmpty(profile.specialtyCodes)}">
                전문분야 미등록
              </span>
					</div>
				</label>
			</form>
		</article>

		<!-- 우: 신청현황 -->
		<article class="card list">
			<header class="card-head">
				<h2>신청현황</h2>
			</header>

			<div class="list-scroll">
				<div class="list-head list-grid" role="rowgroup" aria-hidden="true">
					<div class="col">신청일</div>
					<div class="col">고객명</div>
					<div class="col">분류</div>
					<div class="col">매칭일</div>
					<div class="col">매칭여부</div>
					<div class="col">채팅/청구</div>
				</div>
				<ul id="applyList" class="list-body" role="rowgroup" aria-live="polite"></ul>
			</div>

			<footer class="list-foot">
				<button type="button" class="btn btn--ghost" id="prevPage">이전</button>
				<span id="pageInfo" class="page-info">1 / 1</span>
				<button type="button" class="btn btn--ghost" id="nextPage">다음</button>
			</footer>
		</article>
	</section>

	<section class="cta-wrap">
		<a class="btn btn--accent" th:href="@{/mypage/expert/mainpage(expertId=${expertId})}" id="reqBtn" role="button">상담 신청 확인</a>
		<button type="button" class="btn btn--accent" id="scheduleBtn">상담 일정 확인하기</button>
		<button type="button" class="btn btn--accent btn--danger" id="withdrawBtn">회원탈퇴</button>
	</section>
</main>

<!-- ====== 청구서 모달 ====== -->
<div id="invoiceModal" class="modal" aria-hidden="true">
	<div class="modal__backdrop" data-close="invoice"></div>
	<div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="invModalTitle">
		<header class="modal__head">
			<h3 id="invModalTitle">청구서 발행</h3>
			<button type="button" class="modal__close" data-close="invoice" aria-label="닫기">×</button>
		</header>
		<div class="modal__body">
			<form id="invoiceForm" class="fee-form" autocomplete="off">
				<label class="field"><span class="label">고객</span><input id="invUser" type="text" value="" placeholder="고객명" disabled /></label>
				<label class="field"><span class="label">항목명</span><input id="invTitle" type="text" placeholder="예) 협박·갈취 상담료" /></label>
				<label class="field"><span class="label">금액(원)</span><input id="invAmount" type="text" inputmode="numeric" autocomplete="off" placeholder="예) 300000" /><span class="help">쉼표는 자동으로 들어갑니다.</span></label>
				<label class="field"><span class="label">마감일(선택)</span><input id="invDue" type="date" /></label>
				<label class="field"><span class="label">메모(선택)</span><textarea id="invMemo" rows="4" placeholder="전달 메모를 입력하세요."></textarea></label>
			</form>
		</div>
		<footer class="modal__actions">
			<button type="button" class="btn" data-close="invoice">취소</button>
			<button type="button" class="btn btn--primary" id="invoiceSubmitBtn">발행</button>
		</footer>
	</div>
</div>

<script th:inline="javascript">
	window.__SPECIALTIES__ = /*[[${specialtyOptions}]]*/[];
</script>
<script type="module" th:src="@{/js/expert/expert_mypage.js}"></script>
<script th:src="@{/js/pay/expert-invoice.js}"></script>
</body>
</html>
